<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secret Admin ♡</title><style>*{box-sizing:border-box}body{margin:0;background:#24191e;color:#fff8f8;font-family:Georgia,serif}.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}.shade{position:fixed;inset:0;background:#160c11bb;z-index:-1}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}.card{width:min(100%,720px);padding:clamp(20px,4vw,32px);background:#27141de0;border:1px solid #ffffff55;border-radius:20px;backdrop-filter:blur(10px)}h1{text-align:center;font-weight:normal}input{width:100%;padding:12px;margin:8px 0 14px;border-radius:10px;border:1px solid #ffffff66;background:#ffffff18;color:white;font-size:16px}button{padding:13px;width:100%;border:0;border-radius:12px;background:#ffdce5;color:#44202c;font-weight:bold;cursor:pointer}.msg,.note{line-height:1.5}.item{padding:14px 0;border-top:1px solid #ffffff44;line-height:1.6;overflow-wrap:anywhere}.answer{white-space:pre-wrap}.hidden{display:none}</style></head><body><img class="bg" src="background.jpeg" alt=""><div class="shade"></div><main class="wrap"><section class="card"><h1>Secret Admin 🔐</h1><p class="note">Arya, log in with the admin password you set on Render.</p><form id="login"><label>Admin password</label><input id="pass" type="password" required autocomplete="current-password"><button>Open answers ♡</button></form><p class="msg" id="msg" aria-live="polite"></p><div id="answers"></div></section></main><script>
const API_BASE="https://arya-love-website.onrender.com"; // Replace after deploying backend
const form=document.getElementById('login'),msg=document.getElementById('msg'),box=document.getElementById('answers');
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Checking password…';box.innerHTML='';try{const r=await fetch(`${API_BASE}/api/admin/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pass').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');const token=d.token;const res=await fetch(`${API_BASE}/api/admin/submissions`,{headers:{Authorization:`Bearer ${token}`}});const out=await res.json();if(!res.ok)throw new Error(out.error||'Could not load answers');form.classList.add('hidden');msg.textContent=out.length?`Found ${out.length} submission(s). ❤️`:'No answers yet. When Subin submits, they will appear here.';out.forEach((s,i)=>{const div=document.createElement('div');div.className='item';const h=document.createElement('h3');h.textContent=`Submission ${out.length-i} — ${s.name||'No name'} (${new Date(s.submittedAt).toLocaleString()})`;div.appendChild(h);s.answers.forEach((a,j)=>{const p=document.createElement('p');p.className='answer';p.textContent=`${j+1}. ${a.question}\nAnswer: ${a.answer}`;div.appendChild(p)});box.appendChild(div)});}catch(err){msg.textContent=err.message==='Invalid admin password'?'Wrong password. Try again.':'Could not connect. Check the backend URL and try again.';console.error(err)}});
</script></body></html>
